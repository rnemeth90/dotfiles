[Login]
# Suspend when lid is closed on battery or AC
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Power button suspends instead of immediate poweroff
HandlePowerKey=suspend

# Suspend after 20 min idle on battery (0 = disabled)
IdleAction=ignore

# Allow users to suspend without sudo
KillUserProcesses=no
