# TLP Configuration - ThinkPad T420
# Install: sudo cp os/arch/tlp.conf /etc/tlp.conf && sudo tlp start
#
# T420 uses tp-smapi for battery thresholds (not acpi_call).
# Required packages: tlp tp_smapi-dkms (AUR) tlp-rdw
# Enable services: systemctl enable tlp tlp-sleep

TLP_ENABLE=1
TLP_DEFAULT_MODE=AC
TLP_PERSISTENT_DEFAULT=0

# Battery charge thresholds (tp-smapi, ThinkPad T420)
# Start charging when battery drops below START threshold.
# Stop charging when battery reaches STOP threshold.
# 40/80 is a good balance between longevity and usable capacity.
START_CHARGE_THRESH_BAT0=40
STOP_CHARGE_THRESH_BAT0=80

# Ultrabay/slice battery (if present)
START_CHARGE_THRESH_BAT1=40
STOP_CHARGE_THRESH_BAT1=80

# CPU scaling governor
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Sandy Bridge energy/performance bias
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# CPU boost on battery (disable to save power)
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Platform power profiles (ignored if not supported, safe to leave)
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# Disk power management
DISK_DEVICES="sda sdb"
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"
DISK_SPINDOWN_TIMEOUT_ON_AC="0 0"
DISK_SPINDOWN_TIMEOUT_ON_BAT="0 0"
DISK_IOSCHED="mq-deadline mq-deadline"

# SATA link power management
SATA_LINKPWR_ON_AC=med_power_with_dipm
SATA_LINKPWR_ON_BAT=med_power_with_dipm

# PCI Express ASPM
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# WiFi power saving
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Disable Wake-on-LAN
WOL_DISABLE=Y

# USB autosuspend
USB_AUTOSUSPEND=1
# Exclude USB devices from autosuspend by ID if needed:
# USB_EXCLUDE_VENDOR_ID="046d:c52b"  # example: Logitech receiver

# Bluetooth on startup (disable on battery, keep on AC)
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth"

# Runtime power management for PCI devices
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

# ThinkPad-specific: restore battery thresholds after suspend/hibernate
RESTORE_THRESHOLDS_ON_BAT=1
