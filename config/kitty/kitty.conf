# Font
font_family      Hack Nerd Font Mono
bold_font        Hack Nerd Font Mono Bold
italic_font      Hack Nerd Font Mono Italic
font_size        10.0

# Kanagawa Wave colors
foreground              #dcd7ba
background              #1f1f28
selection_foreground    #c8c093
selection_background    #2d4f67
cursor                  #c8c093
cursor_text_color       #1f1f28
url_color               #7e9cd8

# Normal colors
color0  #090618
color1  #c34043
color2  #76946a
color3  #c0a36e
color4  #7e9cd8
color5  #957fb8
color6  #6a9589
color7  #c8c093

# Bright colors
color8  #727169
color9  #e82424
color10 #98bb6c
color11 #e6c384
color12 #7fb4ca
color13 #938aa9
color14 #7aa89f
color15 #dcd7ba

# Window
background_opacity  0.95
window_padding_width 6
remember_window_size yes
hide_window_decorations yes

# Cursor
cursor_shape          block
cursor_blink_interval 0

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Scrollback
scrollback_lines 10000

# Performance
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# Image protocol (kitty native — works with ranger, neovim, etc.)
allow_remote_control yes

# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+return new_window
