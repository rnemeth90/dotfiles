##### General #####

# True color support — pick one terminal and stick to it
set-option -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc,screen-256color:Tc,xterm-kitty:Tc"

set-option -g history-limit 10000
set-option -s escape-time 0
set-option -g repeat-time 300
set-option -g focus-events on

bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"


##### Status Line #####

set-option -g status on
set-option -g status-interval 5
set-option -g status-justify centre
set-option -g status-bg colour235
set-option -g status-fg colour136
set-option -g status-left '#[fg=green]#S '
set-option -g status-right '#[fg=cyan]%Y-%m-%d #[fg=white]%H:%M:%S'
setw -g window-status-format ' #I:#W#{?window_flags,#{window_flags},} '
setw -g window-status-current-format '#[reverse] #I:#W#{?window_flags,#{window_flags},} #[noreverse]'
set-option -g window-status-separator '  '
set-option -g set-titles off
set-option -g set-titles-string '#T'


##### Mouse & Copy Mode #####

set-option -g mouse on
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Copy selection to system clipboard (Linux: xsel, macOS: pbcopy)
if-shell "command -v xsel > /dev/null 2>&1" \
  "bind y run-shell 'tmux save-buffer - | xsel --clipboard --input'" \
  "bind y run-shell 'tmux save-buffer - | pbcopy'"


##### Panes & Navigation #####

set-option -g base-index 1
setw -g pane-base-index 1

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window


##### Sessions #####

bind C-c new-session
bind BTab switch-client -l


##### Theme #####

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux


##### Misc #####

bind-key . run -b 'tmux rename-window "`basename \"#{pane_current_path}\"`"'

# Fuzzy-find a window across all sessions and switch to it
bind-key f display-popup -E -w 60% -h 50% "tmux list-windows -a -F '#S:#I  #W' | fzf --reverse --prompt='window> ' | cut -d' ' -f1 | xargs tmux switch-client -t"

bind C-l send-keys C-l \; run-shell 'sleep 0.1' \; clear-history
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{==:#{pane_current_command},nvim},nvim:#{b:pane_current_path},#{?#{m:*GitHub Copilot,#{pane_title}},copilot:#{=/24/…;s/ - GitHub Copilot$//:pane_title},#{pane_current_command}}}'
set-option -g renumber-windows on
